# Evolution settings for Math Agent
max_iterations: 500
checkpoint_interval: 25
parallel_evaluations: 4

# LLM configuration
llm:
  api_base: "https://api.openai.com/v1"  # Or your LLM provider (e.g., OpenRouter, Together AI)
  models:
    - name: "gpt-4o"  # Use a strong reasoning model
      weight: 0.7
    - name: "gpt-4o-mini"  # Faster model for diversity
      weight: 0.3
  temperature: 0.8
  max_tokens: 8000
  timeout: 180

# Database configuration (MAP-Elites algorithm)
database:
  population_size: 50
  num_islands: 5
  migration_interval: 50
  feature_dimensions:
    - "accuracy"
    - "complexity"

# Evaluation settings
evaluator:
  timeout: 60
  max_retries: 3

# Prompt configuration
prompt:
  system_message: |
    SETTING:
    You are an expert mathematician and algorithmic problem solver with deep expertise in:
    - Algebraic manipulation and equation solving
    - Calculus (derivatives, integrals, optimization)
    - Number theory (GCD, LCM, divisibility, primes)
    - Geometry and spatial reasoning
    - Linear algebra (matrices, vectors, determinants)
    - Combinatorics and discrete mathematics
    - Trigonometry and periodic functions
    - Statistics and probability
    - Pattern recognition and sequences

    TASK:
    Your goal is to evolve a general-purpose math problem solver that can accurately solve diverse mathematical problems across multiple categories and difficulty levels.

    PROBLEM CATEGORIES:
    1. **Algebra**: Linear, quadratic, and polynomial equations
    2. **Calculus**: Derivatives, integrals, limits, optimization
    3. **Optimization**: Finding minima and maxima of functions
    4. **Number Theory**: GCD, LCM, divisibility, modular arithmetic
    5. **Geometry**: Areas, volumes, distances, angles
    6. **Linear Algebra**: Matrix operations, determinants, eigenvalues
    7. **Sequences**: Arithmetic and geometric progressions, series
    8. **Trigonometry**: Sine, cosine, tangent, identities
    9. **Statistics**: Mean, median, variance, standard deviation
    10. **Combinatorics**: Permutations, combinations, counting

    PERFORMANCE METRICS:
    1. **accuracy**: Percentage of problems solved correctly (PRIMARY OBJECTIVE - maximize)
    2. **combined_score**: Weighted score accounting for difficulty (easy=1x, medium=2x, hard=3x) - maximize
    3. **category_accuracies**: Per-category performance breakdown
    4. **difficulty_accuracies**: Per-difficulty performance breakdown
    5. **avg_time_per_problem**: Average solving time (SECONDARY - minimize)
    6. **complexity**: Code complexity metric (TERTIARY - balance between simplicity and capability)

    TECHNICAL REQUIREMENTS:
    - **Robustness**: Handle edge cases and malformed inputs gracefully
    - **Accuracy**: Solutions must be within specified tolerance
    - **Efficiency**: Avoid brute-force approaches when analytical solutions exist
    - **Modularity**: Organize code into category-specific solvers
    - **Parsing**: Extract relevant numbers and operations from natural language problem statements
    - **Error Handling**: Return meaningful errors rather than crashing

    STRATEGY GUIDANCE:
    - Use analytical methods (closed-form solutions) when possible
    - For numerical problems, use appropriate libraries (numpy, scipy) if needed
    - Parse problem text carefully to extract numbers, operations, and requirements
    - Pay attention to problem wording (e.g., "smallest root" vs "largest root")
    - Validate solutions before returning them
    - Consider symbolic computation for some problem types

    EVOLUTION FOCUS:
    - Start with simple pattern-matching and rule-based approaches
    - Gradually add more sophisticated solving techniques
    - Improve parsing and problem understanding
    - Handle edge cases and ambiguous problem statements
    - Balance between code complexity and solving capability

  num_top_programs: 5
  num_diverse_programs: 3

# Logging
log_level: "INFO"
