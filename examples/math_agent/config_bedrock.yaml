# Evolution settings for Math Agent - AWS Bedrock Version
max_iterations: 500
checkpoint_interval: 25
parallel_evaluations: 4

# LLM configuration for AWS Bedrock
# IMPORTANT: This requires running LiteLLM proxy first!
#
# Setup:
# 1. Install: pip install litellm[proxy]
# 2. Set AWS credentials:
#    export AWS_ACCESS_KEY_ID="your-key"
#    export AWS_SECRET_ACCESS_KEY="your-secret"
#    export AWS_REGION_NAME="us-east-1"
# 3. Start proxy: litellm --config litellm_bedrock.yaml
# 4. Run evolution: ./run.sh 500 --config config_bedrock.yaml
#
llm:
  api_base: "http://localhost:4000"  # LiteLLM proxy endpoint
  api_key: "dummy"  # Any value works with local LiteLLM proxy
  models:
    # Primary model: Claude 3.5 Sonnet v2 - Best for complex reasoning
    - name: "bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0"
      weight: 0.7

    # Secondary model: Claude 3.5 Haiku - Faster and cheaper for diversity
    - name: "bedrock/anthropic.claude-3-5-haiku-20241022-v1:0"
      weight: 0.3

  temperature: 0.8
  max_tokens: 8000
  timeout: 180

