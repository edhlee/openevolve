# General settings
general_settings:
  # Enable caching for better performance
  cache: True

  # Set completion cost tracking
  completion_cost: True

  # Set master key for proxy (optional, for security)
  # master_key: "sk-your-secret-key"

  # Database for logging requests (optional)
  # database_url: "postgresql://..."

# Logging
litellm_settings:
  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO

  # Success callback - log successful requests
  success_callback: []

  # Failure callback - log failed requests
  failure_callback: []

  # Set timeout for requests (seconds)
  request_timeout: 600

  # Enable streaming
  stream_response: True

# Router settings (for load balancing across regions/models)
router_settings:
  # Routing strategy: simple-shuffle, least-busy, usage-based-routing
  routing_strategy: simple-shuffle

  # Number of retries on failure
  num_retries: 3

  # Allowed fails before marking unhealthy
  allowed_fails: 3

  # Cooldown time before retry (seconds)
  cooldown_time: 30

# Note: Make sure the models you want to use are enabled in your AWS Bedrock account
# Go to AWS Bedrock Console > Model access to request access to models
