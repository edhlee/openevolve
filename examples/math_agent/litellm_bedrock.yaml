# LiteLLM Proxy Configuration for AWS Bedrock
#
# This file configures LiteLLM to act as an OpenAI-compatible proxy for AWS Bedrock models.
#
# Usage:
# 1. Set AWS credentials:
#    export AWS_ACCESS_KEY_ID="your-access-key-id"
#    export AWS_SECRET_ACCESS_KEY="your-secret-access-key"
#    export AWS_REGION_NAME="us-east-1"
#
# 2. Start the proxy:
#    litellm --config litellm_bedrock.yaml
#
# 3. The proxy will run on http://localhost:4000
#
# 4. Use config_bedrock.yaml to run evolution with Bedrock models
#

model_list:
  # Anthropic Claude 3.5 Sonnet v2 - Best for complex reasoning
  - model_name: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_region_name: ${AWS_REGION_NAME:us-east-1}
      max_tokens: 8000

  # Anthropic Claude 3.5 Haiku - Fast and cost-effective
  - model_name: bedrock/anthropic.claude-3-5-haiku-20241022-v1:0
    litellm_params:
